services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-chess_review}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://chess:local-only-change-me@db:5432/chess_review}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on: [db, redis]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://chess:local-only-change-me@db:5432/chess_review}
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    depends_on: [db, redis]
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://chess:local-only-change-me@db:5432/chess_review}
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
volumes:
  postgres_data:
  redis_data:
